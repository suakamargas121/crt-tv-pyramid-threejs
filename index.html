<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Retro TV Pyramid - Three.js</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #060608; font-family: monospace;
      touch-action: none;
    }
    #app { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #ui-overlay {
      position: absolute; top: 16px; left: 16px; color: #fff; z-index: 10;
      background: rgba(0, 0, 0, 0.7); padding: 10px 14px; border-radius: 8px;
      border: 1px solid #333; pointer-events: none;
    }
    #ui-overlay h1 { font-size: 14px; margin-bottom: 4px; color: #ffd700; }
    #ui-overlay p { font-size: 11px; color: #aaa; line-height: 1.4; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui-overlay">
    <h1>CRT TV Pyramid (Persona 4)</h1>
    <p>Move mouse / tilt phone for parallax</p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
